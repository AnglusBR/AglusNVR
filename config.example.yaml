# Configuração do AglusNVR
# Copie para o aglus-nvr.yaml e personalize para sua configuração
# Ou use: ./aglus-nvr init --password <sua-senha>
#
# Todas as durações usam o formato do Go: 30s, 5m, 1h, 24h
# Os IDs das câmeras devem ser únicos e usar kebab-case (por exemplo, "porta-frontal")
# Habilitações, portas e limites são validados na inicialização

# Endereço de escuta do servidor HTTP (padrão: ":9090")
server:
  listen: ":9090"

# Configurações de armazenamento
# root_dir: local de armazenamento das gravações, banco de dados e segmentos HLS.
# Docker: definido pela variável NVR_DATA_DIR (padrão: /data). Veja docker-compose.yml.
# Binário: definido pela opção --data-dir ou diretamente no YAML.
storage:
  root_dir: "/var/lib/aglus-nvr"   # Mude para o seu caminho preferido (ex.: /mnt/external/nvr)
  segment_duration: "30s"          # Duração do segmento MP4 (máximo de 30s no Raspberry Pi)

# Autenticação
# Opção 1: definir password_hash (gere com: aglus-nvr hash-password <senha>)
# Opção 2: Definir senha em texto simples (convertida automaticamente para hash na primeira execução)
auth:
  username: "admin"
  password_hash: ""  # Use `aglus-nvr hash-password <senha>` para gerar
  # password: ""      # Ou defina texto simples aqui (auto-hashado no primeiro início)

# Configuração da câmera — adicione suas câmeras aqui
# Cada câmera deve ter um ID único e URL válida com esquema + host
# Protocolos suportados: rtsp, http, onvif, xiaomi
# Codificações suportadas: h264, h265, mjpeg, jpeg
cameras: []
# Exemplos de câmeras:
# cameras:
#   - id: "front-door"
#     name: "Porta da frente"
#     protocol: "rtsp"        # Transporte: rtsp, http, onvif, xiaomi
#     encoding: "h264"         # Codificação: h264, h265, mjpeg, jpeg
#     url: "rtsp://192.168.1.100:554/stream"
#     enabled: true
#     audio_enabled: false          # Ativar gravação de áudio (padrão: falso)
#     frame_watchdog_timeout: "30s"  # Tempo antes de declarar a câmera como não saudável (padrão: 30s)
#     timelapse:                      # Gravação em timelapse por câmera
#       enabled: false               # Ativar timelapse (padrão: falso)
#       interval: "30s"              # Intervalo de snapshot (padrão: 30s)
#     health_overrides:              # Overries de limiar de saúde por câmera
#       freeze_timeout: "10s"        # Tempo de espera para detectar stream congelado (padrão: 10s)
#   - id: "quintal"
#     name: "Quintal"
#     protocol: "http"
#     encoding: "jpeg"
#     url: "http://192.168.1.101/capture"
#     enabled: true
#     audio_enabled: false          # Ativar gravação de áudio (padrão: falso). Não suportado para MJPEG/HTTP-JPEG.
#     frame_watchdog_timeout: "30s"  # Tempo antes de declarar a câmera como não saudável (padrão: 30s)
#     timelapse:                      # Gravação em timelapse por câmera
#       enabled: false               # Ativar timelapse (padrão: falso)
#       interval: "30s"              # Intervalo de snapshot (padrão: 30s)
#     health_overrides:              # Overries de limiar de saúde por câmera
#       freeze_timeout: "10s"        # Tempo de espera para detectar stream congelado (padrão: 10s)
#   - id: "xiaomi-cam"
#     name: "Câmera Xiaomi"
#     protocol: "xiaomi"
#     encoding: "h264"
#     did: "xiaomi_device_id"      # ID do Xiaomi do dispositivo
#     vendor: "cs2"                # Fornecedor de transporte: "cs2" (padrão)
#     enabled: true
#     audio_enabled: false          # Ativar gravação de áudio (padrão: falso)
#     frame_watchdog_timeout: "30s"  # Tempo antes de declarar a câmera como não saudável (padrão: 30s)
#     timelapse:                      # Gravação em timelapse por câmera
#       enabled: false               # Ativar timelapse (padrão: falso)
#       interval: "30s"              # Intervalo de snapshot (padrão: 30s)
#     health_overrides:              # Overries de limiar de saúde por câmera
#       freeze_timeout: "10s"        # Tempo de espera para detectar stream congelado (padrão: 10s)

# Xiaomi configurações da conta na nuvem (necessárias para câmeras Xiaomi)
# xiaomi:
#   user_id: ""    # Preenchido após o primeiro login
#   token: ""      # Xiaomi passToken (obtido via /api/xiaomi/auth)
#   region: "cn"   # Região: cn, sg, de, etc.

# Limpeza — políticas de retenção e limiar de disco
# A limpeza segue um cronograma e remove gravações antigas
cleanup:
  retention_days: 30               # Exclua gravações com mais de N dias (1-3650)
  check_interval: "1h"             # Com que frequência verificar gravações vencidas
  disk_threshold_percent: 95       # Iniciar a limpeza quando o uso do disco ultrapassar N% (50-99)

# Fusão de segmentos — combinar segmentos curtos em gravações mais longas
# Só entra em funcionamento quando enabled é true. Nesse caso, todos os campos de duração são obrigatórios.
merge:
  enabled: false                   # Ativar a fusão de segmentos
  check_interval: "1h"             # Com que frequência verificar candidatos à fusão
  window_size: "1h"                # Janela de tempo para fusão de segmentos
  batch_limit: 200                 # Segmentos máximos para se unir em um único lote
  min_segment_age: "10m"           # Idade mínima antes de um segmento poder ser fundido
  min_segments_to_merge: 3         # Segmentos mínimos necessários para acionar uma fusão

# Servidor FTP — fornece acesso a arquivos via protocolo FTP
# Porta de controle e intervalo de portas passivas configuráveis
ftp:
  enabled: true                    # Ativar servidor FTP (padrão: verdadeiro)
  port: 2121                       # Porta de controle FTP (1-65535)
  passive_port_range: "2122-2140"  # Faixa de portas em modo passivo

# MQTT gravação baseada em gatilhos para integração com casas inteligentes
# Quando ativado, inscreva-se no tópico para gravação de gatilhos
mqtt:
  enabled: false                   # Habilitar MQTT cliente
  broker: "tcp://localhost:1883"   # URL do broker MQTT
  topic: "aglusnvr/trigger"        # Tópico MQTT para assinatura
  client_id: "aglus-nvr"           # ID do cliente MQTT
  username: ""                     # Usuário do broker MQTT (opcional)
  password: ""                     # Senha do broker MQTT (opcional; criptografada automaticamente quando configurado)

# Servidor WebDAV — acesso a arquivos pelo protocolo WebDAV
# Compartilha diretório de gravações sobre HTTP
webdav:
  enabled: true                    # Ativar WebDAV servidor (padrão: true)
  path_prefix: "/dav"              # Prefixo de caminho de URL para acesso WebDAV
  read_write: false                # Permitir operações de escrita (PUT, MKCOL, DELETE, etc.)

# Transmissão HLS — visualização ao vivo sob demanda pela interface web
# Restrição do Raspberry Pi: no máximo 4 transmissões simultâneas
hls:
  write_buffer_size: 40            # Buffer de quadros assíncrono por stream (padrão: 100)
  segment_max_size_mb: 10          # HLS tamanho máximo de segmento em MB (padrão: 10)
  segment_count: 7                 # Segmentos por stream (intervalo: 3-10, padrão: 7)
  max_streams: 4                   # Fluxo máximo de HLS concorrentes (intervalo: 1-20, padrão: 4)
  low_latency: false               # Ativar HLS de baixa latência (padrão: falso)
  part_min_duration: "200ms"       # LL-HLS duração da peça (faixa: 100ms-1s, padrão: 200ms)

# Observabilidade — registro e depuração
observability:
  log_level: "info"                # Nível de log: debug, info, warn, error (padrão: info)
  log_format: "text"               # Formato do log: json ou texto (padrão: texto)
  # enable_pprof: false            # Habilitar endpoints de depuração pprof (padrão: falso)

# Transcodificação — transcodificação opcional de vídeo via FFmpeg
# Usado para reduzir a taxa de bits, mudar o formato do codec ou ajustar qualidade
# Exige que o ffmpeg seja instalado no sistema
# transcoding:
#   enabled: false              # Ativar transcodificação (padrão: falso)
#   ffmpeg_path: ""              # Caminho para o binário ffmpeg (vazio = auto-detectação)
#   max_workers: 1               # Máximo de trabalhos concorrentes de transcodificação (intervalo: 1-4, padrão: 1)
#   replace_original: false      # Substituir as gravações originais por versões transcodificadas
#   download_url: ""             # URL de download FFmpeg preenchida automaticamente por plataforma
#
# Sobreposições de transcodificação por câmera:
#   cameras:
#     - id: "front-door"
#       ...
#       transcoding:
#         enabled: true           # Ativado o override global para esta câmera
#         target_codec: "h264"    # Codec alvo: h264, h265 (padrão: igual à fonte)
#         preset: "ultrafast"     # FFmpeg predefinição: ultrarápido, rápido, médio (padrão: ultrarápido)
#         bitrate: "2M"           # Taxa de bits alvo (ex.: "1M", "2M", "500K")

# Streaming — protocolo padrão de visualização ao vivo e configurações por protocolo
# streaming:
#   default_protocol: "hls"          # Protocolo padrão de streaming: HLS, LL-HLS, WEBRTC, FLV (padrão: HLS)
#   webrtc:
#     enabled: true                   # Ativar WebRTC WHEP streaming (padrão: verdadeiro)
#     max_viewers: 2                  # Máximo de visualizações concorrentes WebRTC (intervalo: 1-10, padrão: 2)
#     idle_timeout: "60s"             # WebRTC tempo de espera do visualizador (padrão: 60s)
#   flv:
#     enabled: true                   # Ativar HTTP-FLV streaming (padrão: true)
#     max_viewers: 10                 # Visualizadores FLV simultâneos no máximo (intervalo: 1-50, padrão: 10)
#     idle_timeout: "60s"             # Tempo de espera do visualizador FLV (padrão: 60s)
#     gop_cache_size: 1               # Tamanho do cache FLV GOP (padrão: 1)

# WebSocket streaming — streaming binário de quadros
# websocket:
#   max_viewers: 10                  # Máximo de WebSocket concorrentes (padrão: 10)
#   write_buf_size: 100               # WebSocket tamanho do buffer de escrita (padrão: 100)
#   idle_timeout: "60s"               # WebSocket tempo de espera (padrão: 60s)

# Monitoramento de saúde de câmeras — detecção e remediação automática de saúde
# health:
#   enabled: false                   # Ativar monitoramento de saúde (padrão: falso)
#   events_retention: "720h"          # Duração da retenção dos eventos de saúde (padrão: 720h / 30 dias)
#   alerts:
#     cooldown: "5m"                 # Tempo de recarga do alerta entre notificações (padrão: 5m)
#     mqtt: false                     # Envie alertas de saúde via MQTT (padrão: falso)
#   layer1:
#     offline_threshold: "30s"        # Tempo antes de declarar a câmera offline (padrão: 30s)
#   layer2:
#     bitrate_change_threshold: 0.5   # Razão máxima de alteração de taxa de bits (0-1, padrão: 0,5)
#     min_fps: 5                      # FPS mínimo aceitável (padrão: 5)
#     max_idr_interval: "60s"          # Intervalo máximo IDR (padrão: 60s)
#   layer2_5:
#     freeze_timeout: "10s"           # Tempo de espera para detectar stream congelado (padrão: 10s)
#   auto_remediation:
#     enabled: false                  # Ativar reinicialização automática da câmera (padrão: falso)
#     max_restarts_per_hour: 3         # Reinicialização máxima por hora por câmera (padrão: 3)
#     cooldown_minutes: 5             # Tempo de recarga entre reinicializações em minutos (padrão: 5)
#     blacklist_hours: 1              # Horas para colocar a câmera na lista negra após falhas repetidas (padrão: 1)
#     global_max_per_min: 10          # Reinicialização máxima em todas as câmeras por minuto (padrão: 10)

# Registro remoto — envie logs para um endpoint externo de HTTP
# remote_log:
#   enabled: false                   # Ativar registro remoto (padrão: falso)
#   endpoint: ""                      # HTTP URL de endpoint para entrega de logs
#   format: "jsonline"               # Formato do log: jsonline, loki (padrão: jsonline)

# Inferência de IA — Detecção de objetos em tempo de execução ONNX
# ai:
#   inference_timeout_ms: 5000        # Tempo limite de inferência em ms (padrão: 5000)
#   frame_skip_rate: 10              # Processe todo frame N-ésimo (padrão: 10)
#   confidence_threshold: 0.5         # Limiar de confiança em detecção (padrão: 0,5)
#   model_path: ""                   # Caminho para o modelo ONNX (vazio = download automático)

# RTMP servidor de ingest — receber RTMP push streams
# rtmp:
#   enabled: false                   # Ativar RTMP servidor (padrão: falso)
#   port: 1935                       # RTMP Catch port (padrão: 1935)
#   stream_keys: {}                  # ID da câmera para mapeamento de teclas de stream (ex.: porta da frente: mykey)

# SRT ouvinte — receba streams SRT/MPEG-TS
# srt:
#   enabled: false                   # Ativar SRT ouvinte (padrão: falso)
#   port: 9000                       # SRT Listen Port (padrão: 9000)
#   streams: []                      # SRT mapeamentos de fluxo (camera_id, modo, endereço, senha, stream_id)

# Autenticação por métricas — BasicAuth opcional para o endpoint /metrics
# metrics_auth:
#   username: ""                     # Nome de usuário do endpoint de métricas (vazio = acesso público)
#   password: ""                     # Senha de endpoint de métricas
#   password_hash: ""                 # Hash de senha de endpoint de métricas (bcrypt)
