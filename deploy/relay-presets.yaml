# =============================================================================
# AglusNVR — Presets de Retransmissão de Plataforma ao Vivo
# =============================================================================
# Este arquivo é OPCIONAL. Se estiver ausente, ilegível ou não contiver
# predefinições válidas, o aplicativo usará os cinco padrões internos
# compilados no binário (veja internal/relay/presets.go:builtinPresets).
#
# Cada entrada em "presets:" usa o nome da predefinição como chave. O valor deve
# corresponder exatamente aos campos da estrutura Preset. Campos desconhecidos são rejeitados.
#
# AVISO: não coloque chaves de transmissão, credenciais ou outros segredos neste arquivo.
# As sugestões de URL são apenas endpoints públicos de entrada. Acrescente a chave
# durante a configuração da retransmissão ou injete-a por variável de ambiente.
#
# Referência: estrutura Preset em internal/relay/presets.go
# =============================================================================

presets:

  # ---------------------------------------------------------------------------
  # Bilibili — transmissão ao vivo do bilibili
  # Origem: builtinPresets["bilibili"] em internal/relay/presets.go
  # Entrada: rtmp://live-push.bilivideo.com/live-bvc/
  # ---------------------------------------------------------------------------
  bilibili:
    name: bilibili
    description: Transmissão ao vivo do Bilibili
    url_hint: rtmp://live-push.bilivideo.com/live-bvc/
    gop_seconds: 2
    video_bitrate_kbps: 4000
    audio_bitrate_kbps: 128
    resolution: 1920x1080
    framerate: 30
    profile: main
    bframes: 2
    audio_codec_required: aac

  # ---------------------------------------------------------------------------
  # Douyin — Douyin/TikTok ao vivo (vídeo vertical)
  # Origem: builtinPresets["douyin"] em internal/relay/presets.go
  # Entrada: rtmp://live-push.douyin.com/
  # Nota: a resolução é 1080x1920 (retrato), não 1920x1080
  # ---------------------------------------------------------------------------
  douyin:
    name: douyin
    description: Douyin/TikTok ao vivo
    url_hint: rtmp://live-push.douyin.com/
    gop_seconds: 2
    video_bitrate_kbps: 3500
    audio_bitrate_kbps: 128
    resolution: 1080x1920
    framerate: 30
    profile: main
    bframes: 0
    audio_codec_required: aac

  # ---------------------------------------------------------------------------
  # YouTube — YouTube Live
  # Origem: builtinPresets["youtube"] em internal/relay/presets.go
  # Entrada: rtmp://a.youtube.com/live2/
  # ---------------------------------------------------------------------------
  youtube:
    name: youtube
    description: YouTube Live
    url_hint: rtmp://a.youtube.com/live2/
    gop_seconds: 2
    video_bitrate_kbps: 4500
    audio_bitrate_kbps: 128
    resolution: 1920x1080
    framerate: 30
    profile: high
    bframes: 2
    audio_codec_required: aac

  # ---------------------------------------------------------------------------
  # Kuaishou — Kuaishou ao vivo
  # Origem: builtinPresets["kuaishou"] em internal/relay/presets.go
  # Entrada: rtmp://txyun-push.voip.yximgs.com/gifshow/
  # ---------------------------------------------------------------------------
  kuaishou:
    name: kuaishou
    description: Kuaishou ao vivo
    url_hint: rtmp://txyun-push.voip.yximgs.com/gifshow/
    gop_seconds: 2
    video_bitrate_kbps: 4000
    audio_bitrate_kbps: 128
    resolution: 1920x1080
    framerate: 30
    profile: main
    bframes: 2
    audio_codec_required: aac

  # ---------------------------------------------------------------------------
  # Genérico — destino RTMP para plataformas desconhecidas ou sem nome
  # Origem: builtinPresets["generic"] em internal/relay/presets.go
  # Nota: audio_codec_required "any" aceita AAC e G.711.
  # bframes=0 significa sem B-frames (menor latência).
  # url_hint está intencionalmente vazio — o usuário deve fornecer a URL.
  # ---------------------------------------------------------------------------
  generic:
    name: generic
    description: Alvo genérico RTMP
    url_hint: ""
    gop_seconds: 2
    video_bitrate_kbps: 3000
    audio_bitrate_kbps: 128
    resolution: 1920x1080
    framerate: 30
    profile: main
    bframes: 0
    audio_codec_required: any
