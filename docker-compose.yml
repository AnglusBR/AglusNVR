# AglusNVR — Docker Compose
# Uso:
#   1. docker compose up -d
#   2. Abra http://localhost:9090
#   3. Conclua o assistente de configuração no navegador
#
# Armazenamento:
#   As gravações e o banco de dados ficam em /data no contêiner.
#   A montagem padrão liga ./data no host a /data no contêiner.
#   Para usar outro diretório no host, como um disco externo:
#     volumes:
#       - /mnt/external/nvr:/data    # ← altere o lado esquerdo
#   O lado direito (:data) deve corresponder a NVR_DATA_DIR.
#
# Permissões:
#   O contêiner usa UID/GID 1000 por padrão.
#   Garanta que esse usuário possa gravar no diretório do host ou ajuste
#   NVR_UID/NVR_GID para o proprietário do diretório.
#
# Rede:
#   Por padrão é usada a rede bridge com mapeamento de portas.
#   O WS-Discovery do ONVIF (multicast UDP) não funciona nesse modo.
#   Para ativar a descoberta automática, habilite "network_mode: host"
#   e remova a seção "ports".
services:
  aglus-nvr:
    image: ghcr.io/seu-usuario/aglusnvr:latest
    container_name: aglus-nvr
    restart: unless-stopped

    # Habilite a linha abaixo para usar a rede do host.
    # Isso é necessário para a descoberta automática ONVIF e pode melhorar
    # o desempenho de WebRTC/FLV. Nesse modo, REMOVA a seção "ports".
    # network_mode: host

    ports:
      - "9090:9090"   # Interface web / API
      - "2121:2121"   # FTP
      - "2122-2140:2122-2140"  # FTP passive ports
    volumes:
      - ./data:/data
    environment:
      - NVR_DATA_DIR=/data
      # Use o UID/GID do proprietário de ./data no host.
      # O padrão é 1000:1000.
      # - NVR_UID=1000
      # - NVR_GID=1000
    healthcheck:
      test: ["CMD", "aglus-nvr", "health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
